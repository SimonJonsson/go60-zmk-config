name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test the Layout Editor JSON converter
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate Layout Editor JSON from the keymap
        run: python3 scripts/keymap_to_layout_json.py config/go60.keymap --conf config/go60.conf -o go60-layout.json
      - name: Upload Layout Editor JSON
        uses: actions/upload-artifact@v4
        with:
          name: go60-layout.json
          path: go60-layout.json
      - uses: actions/checkout@v4
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-22.05
      - uses: cachix/cachix-action@v14
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
      - name: Build Go60 combined firmware
        run: nix-build config -o combined
      - name: Copy result out of nix store
        run: cp combined/go60.uf2 go60.uf2
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: go60.uf2
          path: go60.uf2
